<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rainpedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/demo-toolbar.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="navbar-brand">
                <img src="assets/images/rainpedia.png" alt="Rainpedia" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                <span style="display:none;">RAINPEDIA</span>
            </a>
            <div class="navbar-actions">
                <a href="index.html" class="btn btn-outline btn-sm">Beranda</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="assets/images/rainpedia.png" alt="Rainpedia" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            </div>
            <h1 class="auth-title">Masuk ke Akun</h1>
            <p class="auth-subtitle">Silakan login untuk mulai meminjam dan membeli buku.</p>

            <!-- Alert Simulasi Deactivated User -->
            <div id="deactivatedNotice" class="alert alert-danger" style="display:none; font-size:0.88rem; line-height:1.4;">
                ⚠️ <strong>Akun Anda telah dinonaktifkan oleh administrator.</strong>
            </div>

            <!-- Demo Quick Login Buttons -->
            <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:12px; margin-bottom:16px;">
                <div style="font-size:0.75rem; font-weight:800; color:#1e40af; text-transform:uppercase; margin-bottom:8px;">⚡ Quick Demo Login:</div>
                <div style="display:flex; gap:8px;">
                    <a href="user-dashboard.html" class="btn btn-primary btn-sm" style="flex:1; text-align:center;">👤 Masuk sbg User (Rain)</a>
                    <a href="admin-dashboard.html" class="btn btn-sm" style="flex:1; text-align:center; background:#7c3aed; color:white; font-weight:700;">🛡️ Masuk sbg Admin</a>
                </div>
                <div style="margin-top:8px; text-align:center;">
                    <a href="javascript:void(0)" onclick="toggleDeactivatedAlert()" style="font-size:0.75rem; color:#dc2626; text-decoration:underline;">Lihat Tampilan Akun Dinonaktifkan</a>
                </div>
            </div>

            <form onsubmit="event.preventDefault(); window.location.href='user-dashboard.html';">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" required value="rain@gmail.com" placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" required value="password123" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="auth-footer">
                Belum punya akun? <a href="register.html">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/demo-toolbar.js"></script>
    <script>
        function toggleDeactivatedAlert() {
            const el = document.getElementById('deactivatedNotice');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
